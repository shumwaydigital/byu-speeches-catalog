name: Nightly catalog

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC, about 2–3 a.m. in Utah
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 builder/build_catalog.py
      - name: Publish
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Catalog $(date -u +%F)"
          git push
